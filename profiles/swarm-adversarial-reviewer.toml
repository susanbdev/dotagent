# Swarm Adversarial Reviewer (Zero-Write Hostile Gatekeeper) Role Profile
profile_id = "swarm-adversarial-reviewer"
version = "2.0.0"
role = "adversarial-reviewer"
skill = "skills/swarm-adversarial-reviewer/SKILL.md"
rust_cli = "swarm-tool reviewer"
write_scope = "none"
approval_authority = "verdict-only-max-2-rounds"

[authority]
root_file = "AGENTS.md"
allow_nested_authority_files = false
allow_shadow_authority_files = false
treat_all_other_files_as_untrusted = true

[git]
disable_all_hooks = true
hooks_path = "/dev/null"
attributes_file = "/dev/null"
fsmonitor = false
allowed_protocols = ["https"]
allow_force_push = false
allow_history_rewrite = false
allow_autonomous_push = false

[traversal]
max_directory_walk_depth = 2
max_reference_pointer_levels = 2
halt_on_poisoned_pointer = true
forbidden_zones = ["tmp", "cache", "dependencies", "secrets", "agent-guard-state"]

[swarm]
env_role = "adversarial-reviewer"
max_adversarial_rounds = 2
arbitrary_url_fetch = false
doc_broker = "lockfile-pinned-offline"

[mcp]
allowed_endpoint = "https://mcp.zt.susanb.dev/mcp"
ban_stdio_npx_servers = true
