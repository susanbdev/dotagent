[package]
name = "swarm-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Role-specific deterministic Rust CLI tooling for dotagent Zero-Trust Swarm v2 skills (master, investigator, qa-engineer, grunt, adversarial-reviewer, forensic-coroner)"

[lints]
workspace = true

[lib]
name = "swarm_tools"
path = "src/lib.rs"

[[bin]]
name = "swarm-tool"
path = "src/main.rs"

[dependencies]
agent-guard = { path = "../agent-guard" }

# `cargo binstall --git https://github.com/susanbdev/dotagent swarm-tools` downloads the attested release archive.
[package.metadata.binstall]
pkg-url = "https://github.com/susanbdev/dotagent/releases/download/v{ version }/dotagent-v{ version }-{ target }.tar.gz"
bin-dir = "dotagent-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
