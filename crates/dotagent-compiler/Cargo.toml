[package]
name = "dotagent-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic multi-harness bundle compiler and SHA-256 snapshot verifier for susanbdev/dotagent"

[lints]
workspace = true

[lib]
name = "dotagent_compiler"
path = "src/lib.rs"

[[bin]]
name = "dotagent-compiler"
path = "src/main.rs"

[dependencies]
agent-guard = { path = "../agent-guard" }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regorus = { version = "0.10", default-features = false, features = ["std", "arc"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zip = { version = "=9.7.3", default-features = false, features = ["deflate-flate2"] }

# `cargo binstall --git https://github.com/susanbdev/dotagent dotagent-compiler` downloads the attested release archive.
[package.metadata.binstall]
pkg-url = "https://github.com/susanbdev/dotagent/releases/download/v{ version }/dotagent-v{ version }-{ target }.tar.gz"
bin-dir = "dotagent-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
