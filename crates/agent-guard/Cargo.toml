[package]
name = "agent-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic zero-trust execution, path, traversal, Unicode, token-budget, and prompt-injection guard for AI coding agents"

[lints]
workspace = true

[[bin]]
name = "agent-guard"
path = "src/main.rs"

[[bin]]
name = "dotagent"
path = "src/bin/dotagent.rs"

[[bin]]
name = "agent-guard-sh"
path = "src/bin/agent-guard-sh.rs"

[dependencies]
crc32fast = "1.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std", "zeroize"] }
hmac = "0.12"
regorus = { version = "0.10", default-features = false, features = ["std", "arc"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = { version = "0.5", default-features = false }


# `cargo binstall --git https://github.com/susanbdev/dotagent agent-guard` downloads the attested release archive.
[package.metadata.binstall]
pkg-url = "https://github.com/susanbdev/dotagent/releases/download/v{ version }/dotagent-v{ version }-{ target }.tar.gz"
bin-dir = "dotagent-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
