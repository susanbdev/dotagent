[package]
name = "agent-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic zero-trust execution, path, traversal, Unicode, token-budget, and prompt-injection guard for AI coding agents"

[lints]
workspace = true

[[bin]]
name = "agent-guard"
path = "src/main.rs"

[[bin]]
name = "dotagent"
path = "src/bin/dotagent.rs"

[dependencies]
crc32fast = "1.4"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
