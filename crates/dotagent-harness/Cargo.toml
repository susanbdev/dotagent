[package]
name = "dotagent-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic full-stack test harness for susanbdev/dotagent multi-harness hooks, compiler, and bootstrap"

[lints]
workspace = true

[[bin]]
name = "dotagent-harness"
path = "src/main.rs"

[dependencies]
agent-guard = { path = "../agent-guard" }

# `cargo binstall --git https://github.com/susanbdev/dotagent dotagent-harness` downloads the attested release archive.
[package.metadata.binstall]
pkg-url = "https://github.com/susanbdev/dotagent/releases/download/v{ version }/dotagent-v{ version }-{ target }.tar.gz"
bin-dir = "dotagent-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
