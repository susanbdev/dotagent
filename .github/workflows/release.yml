name: Verifiable Release & SLSA Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-gate:
    name: Pre-Release Security & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-release"
      GIT_AUTHOR_EMAIL: "release@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-release"
      GIT_COMMITTER_EMAIL: "release@dotagent.local"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Run fmt, strict clippy, full test & fuzz suite, compiler verify, and repo audit
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --release --locked -p dotagent-compiler -- verify .
          cargo run --release --locked -p agent-guard --bin dotagent -- audit-repo .

  build-archives:
    name: Build Archive (${{ matrix.target }})
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_musl_tools: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            use_musl_tools: "true"
          - os: macos-latest
            target: x86_64-apple-darwin
            use_musl_tools: "false"
          - os: macos-latest
            target: aarch64-apple-darwin
            use_musl_tools: "false"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools on Linux
        if: matrix.use_musl_tools == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust target (${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build locked release workspace binaries
        run: cargo build --release --locked --workspace --target "${{ matrix.target }}"

      - name: Package deterministic release tarball
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${{ matrix.target }}"
          STAGE="dist-release/${PKG}"
          mkdir -p "${STAGE}/bin"
          for bin in dotagent agent-guard dotagent-compiler swarm-tool dotagent-harness; do
            cp "target/${{ matrix.target }}/release/${bin}" "${STAGE}/bin/${bin}"
            chmod 0555 "${STAGE}/bin/${bin}"
          done
          cp -R dist profiles skills "${STAGE}/"
          cp AGENTS.md README.md THREAT_MODEL.md SECURITY.md CHANGELOG.md "${STAGE}/"
          mkdir -p release-out
          tar -C dist-release -czf "release-out/${PKG}.tar.gz" "${PKG}"

      - name: Upload target archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: release-out/*.tar.gz
          if-no-files-found: error

  publish-attested-release:
    name: SHA256SUMS, SLSA Provenance, & GitHub Release
    needs: build-archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum dotagent-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517eb71b # v2
        with:
          subject-path: |
            artifacts/dotagent-*.tar.gz
            artifacts/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/dotagent-*.tar.gz \
            artifacts/SHA256SUMS \
            --title "dotagent ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
