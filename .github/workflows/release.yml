name: Verifiable Release & SLSA Provenance

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-tag-release:
    name: auto-tag-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout main (zero persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate SemVer Cargo.toml version & check remote release tags
        id: check_ver
        shell: bash
        run: |
          set -euo pipefail
          VER="$(python3 - <<'PY'
          import re, sys, tomllib
          ver = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          if not isinstance(ver, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?", ver):
              sys.stderr.write(f"INVALID_SEMVER: '{ver}'\n")
              sys.exit(1)
          print(ver)
          PY
          )"
          TAG="v${VER}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "needs_tag=false" >> "${GITHUB_OUTPUT}"
            echo "[auto-tag-release] Remote tag ${TAG} already exists; nothing to tag."
          else
            echo "needs_tag=true" >> "${GITHUB_OUTPUT}"
            echo "[auto-tag-release] Detected untagged workspace version ${TAG} on main."
          fi

      - name: Notice when Promoter App is not configured for untagged version bump
        if: steps.check_ver.outputs.needs_tag == 'true' && vars.PROMOTER_APP_ID == ''
        env:
          RELEASE_TAG: ${{ steps.check_ver.outputs.tag }}
        run: |
          echo "::notice::Detected new version ${RELEASE_TAG}; configure vars.PROMOTER_APP_ID or push tag ${RELEASE_TAG} to publish release."

      - name: Mint least-privilege repo-scoped dotagent-promoter[bot] token
        id: app_token
        if: steps.check_ver.outputs.needs_tag == 'true' && vars.PROMOTER_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PROMOTER_APP_ID }}
          private-key: ${{ secrets.PROMOTER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Atomically create annotated release tag via GitHub API (zero token in argv)
        if: steps.check_ver.outputs.needs_tag == 'true' && vars.PROMOTER_APP_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ steps.check_ver.outputs.tag }}
          REPO_FULL: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO_FULL}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "[auto-tag-release] Tag ${TAG} already created concurrently; skipping."
            exit 0
          fi
          TAG_OBJ_SHA="$(gh api --method POST "repos/${REPO_FULL}/git/tags" \
            -f tag="${TAG}" \
            -f message="dotagent ${TAG}" \
            -f object="${TARGET_SHA}" \
            -f type="commit" \
            --jq '.sha')"
          gh api --method POST "repos/${REPO_FULL}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJ_SHA}" >/dev/null
          echo "[auto-tag-release] Pushed annotated tag ${TAG} -> ${TARGET_SHA}"

  verify-release-gate:
    name: Pre-Release Security & Manifest Gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-release"
      GIT_AUTHOR_EMAIL: "release@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-release"
      GIT_COMMITTER_EMAIL: "dotagent-release"
    steps:
      - name: Checkout tag & main ancestry (zero persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify release tag matches Cargo.toml SemVer & descends from origin/main
        shell: bash
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/main; then
            echo "UNMERGED_RELEASE_TAG_FORBIDDEN: ${TAG_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          VER="$(python3 -c 'import re,sys,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?", v); print(v)')"
          EXPECTED_TAG="v${VER}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "TAG_VERSION_MISMATCH: tag '${GITHUB_REF_NAME}' != Cargo.toml '${EXPECTED_TAG}'" >&2
            exit 1
          fi

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Install stable & MSRV 1.88.0 Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
          rustup default stable

      - name: Audit supply chain (SHA-256-pinned cargo-deny 0.22.0)
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          python3 - "${ARCHIVE}" <<'PY'
          import hashlib, sys, urllib.request
          url = "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          expected = "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
          data = urllib.request.urlopen(url, timeout=60).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"cargo-deny SHA-256 mismatch: expected {expected}, got {actual}")
          with open(sys.argv[1], "wb") as fh:
              fh.write(data)
          PY
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny" check advisories licenses bans sources

      - name: Run fmt, strict clippy, MSRV 1.88 check, full test & fuzz suite, compiler verify, and repo audit
        run: |
          cargo fmt --all -- --check
          cargo +1.88.0 check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --release --locked -p dotagent-compiler -- verify .
          cargo run --release --locked -p agent-guard --bin dotagent -- audit-repo .

  build-archives:
    name: Build & Smoke-Test Archive (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            use_musl_tools: "true"
            expect_mode: landlock
            runner_prefix: ""
            dual_repro: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            use_musl_tools: "true"
            expect_mode: landlock
            runner_prefix: ""
            dual_repro: "false"
          - os: macos-15
            target: aarch64-apple-darwin
            use_musl_tools: "false"
            expect_mode: seatbelt
            runner_prefix: ""
            dual_repro: "false"
          - os: macos-15
            target: x86_64-apple-darwin
            use_musl_tools: "false"
            expect_mode: seatbelt
            runner_prefix: "arch -x86_64"
            dual_repro: "false"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools on Linux
        if: matrix.use_musl_tools == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Ensure Rosetta 2 is functional for Intel macOS cleanroom smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Install Rust target (${{ matrix.target }})
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${MATRIX_TARGET}"

      - name: Build locked release workspace binaries with deterministic path remapping
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
          cargo build --release --locked --workspace --target "${MATRIX_TARGET}"

      - name: Package deterministic release archive & run sterile clean-room smoke test
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_EXPECT_MODE: ${{ matrix.expect_mode }}
          MATRIX_RUNNER_PREFIX: ${{ matrix.runner_prefix }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${MATRIX_TARGET}"
          OUT_TAR="release-out/${PKG}.tar.gz"
          bash scripts/package-release-archive.sh \
            --target "${MATRIX_TARGET}" \
            --tag "${TAG}" \
            --out "${OUT_TAR}"

          SMOKE_ARGS=(--archive "${OUT_TAR}" --expect-mode "${MATRIX_EXPECT_MODE}")
          if [[ -n "${MATRIX_RUNNER_PREFIX}" ]]; then
            SMOKE_ARGS+=(--runner-prefix "${MATRIX_RUNNER_PREFIX}")
          fi
          bash scripts/cleanroom-smoke-test.sh "${SMOKE_ARGS[@]}"

      - name: Verify dual-directory bit-for-bit reproducibility on x86_64-unknown-linux-musl
        if: matrix.dual_repro == 'true'
        shell: bash
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${MATRIX_TARGET}"
          ALT_DIR="${RUNNER_TEMP}/repro-check/deep/nested/repo"
          mkdir -p "${ALT_DIR}"
          tar -cf - --exclude='./.git' --exclude='./target' --exclude='./release-out' . | tar -xf - -C "${ALT_DIR}"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          (
            cd "${ALT_DIR}"
            export RUSTFLAGS="--remap-path-prefix=${ALT_DIR}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
            cargo build --release --locked --workspace --target "${MATRIX_TARGET}"
            bash scripts/package-release-archive.sh \
              --target "${MATRIX_TARGET}" \
              --tag "${TAG}" \
              --out "${RUNNER_TEMP}/alt-${PKG}.tar.gz"
          )
          SHA_PRIMARY="$(sha256sum "release-out/${PKG}.tar.gz" | awk '{print $1}')"
          SHA_ALT="$(sha256sum "${RUNNER_TEMP}/alt-${PKG}.tar.gz" | awk '{print $1}')"
          if [[ "${SHA_PRIMARY}" != "${SHA_ALT}" ]]; then
            echo "RELEASE_REPRODUCIBILITY_MISMATCH: ${SHA_PRIMARY} != ${SHA_ALT}" >&2
            exit 1
          fi

      - name: Upload verified target archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: release-out/*.tar.gz
          if-no-files-found: error

  publish-attested-release:
    name: SHA256SUMS, SLSA Provenance, & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Re-verify main branch ancestry prior to release publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Assert tagged commit is merged on origin/main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/main

      - name: Download all smoke-tested target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum dotagent-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/dotagent-*.tar.gz
            artifacts/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/dotagent-*.tar.gz \
            artifacts/SHA256SUMS \
            --title "dotagent ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  verify-published-release:
    name: Post-Publish SLSA & dotagent self-verify (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-attested-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            native_target: x86_64-unknown-linux-musl
          - os: macos-15
            native_target: aarch64-apple-darwin
    steps:
      - name: Verify SLSA attestations on all published assets & run dotagent self-verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NATIVE_TARGET: ${{ matrix.native_target }}
          SIGNER_WF: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          VERIFY_DIR="${RUNNER_TEMP}/post-release-verify"
          mkdir -p "${VERIFY_DIR}/unpacked"
          cd "${VERIFY_DIR}"

          gh release download "${TAG}" --repo "${REPO_FULL}" -p "dotagent-${TAG}-*.tar.gz" -p "SHA256SUMS"
          gh attestation verify "SHA256SUMS" --repo "${REPO_FULL}" --signer-workflow "${SIGNER_WF}" >/dev/null

          ALL_TARGETS=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            aarch64-apple-darwin
            x86_64-apple-darwin
          )
          for t in "${ALL_TARGETS[@]}"; do
            f="dotagent-${TAG}-${t}.tar.gz"
            [[ -f "${f}" ]] || { echo "MISSING_RELEASE_ASSET: ${f}" >&2; exit 1; }
            gh attestation verify "${f}" --repo "${REPO_FULL}" --signer-workflow "${SIGNER_WF}" --format json > "attestation-${t}.json"
          done

          shasum -a 256 -c SHA256SUMS

          NATIVE_PKG="dotagent-${TAG}-${NATIVE_TARGET}"
          tar -xzf "${NATIVE_PKG}.tar.gz" -C "${VERIFY_DIR}/unpacked"
          DOTAGENT_BIN="${VERIFY_DIR}/unpacked/${NATIVE_PKG}/bin/dotagent"

          for t in "${ALL_TARGETS[@]}"; do
            f="dotagent-${TAG}-${t}.tar.gz"
            python3 - "attestation-${t}.json" "statement-${t}.json" <<'PY'
          import base64, json, sys
          bundles = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert isinstance(bundles, list) and len(bundles) >= 1 and isinstance(bundles[0], dict), "invalid attestation bundle"
          b0 = bundles[0]
          stmt = (b0.get("verificationResult") or {}).get("statement")
          if not isinstance(stmt, dict):
              dsse = (b0.get("bundle") or {}).get("dsseEnvelope") or b0.get("dsseEnvelope")
              assert isinstance(dsse, dict) and isinstance(dsse.get("payload"), str), "missing dsseEnvelope payload"
              stmt = json.loads(base64.b64decode(dsse["payload"]).decode("utf-8"))
          assert isinstance(stmt, dict) and isinstance(stmt.get("subject"), list), "invalid SLSA statement"
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              json.dump(stmt, out)
          PY
            "${DOTAGENT_BIN}" self-verify \
              --sums "${VERIFY_DIR}/SHA256SUMS" \
              --subject "${VERIFY_DIR}/${f}" \
              --provenance "${VERIFY_DIR}/statement-${t}.json"
          done
