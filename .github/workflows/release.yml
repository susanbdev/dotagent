name: Verifiable Release & SLSA Provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version with a signed tag staged under release-request/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-request:
    name: Verify the staged release signature
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.request.outputs.release_tag }}
      tag_object: ${{ steps.request.outputs.tag_object }}
      base_commit: ${{ steps.request.outputs.base_commit }}
    steps:
      - name: Require configured release reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')"
          if [[ ! "${reviewers}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure required reviewers for the release environment before promoting a tag."
            exit 1
          fi

      - name: Check out the trusted release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Resolve a GitHub-verified annotated release request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ${#RELEASE_TAG} -gt 64 || ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Enter a release version such as v2.1.0"
            exit 1
          fi
          official_ref="refs/tags/${RELEASE_TAG}"
          request_ref="refs/tags/release-request/${RELEASE_TAG}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          read -r object_type tag_object < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/release-request/${RELEASE_TAG}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          [[ "${object_type}" == tag && "${tag_object}" =~ ^[0-9a-f]{40}$ ]]
          read -r signed_name target_type target_commit verified < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '[.tag, .object.type, .object.sha, .verification.verified] | @tsv'
          )
          [[ "${signed_name}" == "${RELEASE_TAG}" && "${target_type}" == commit &&
             "${target_commit}" =~ ^[0-9a-f]{40}$ && "${verified}" == true ]]
          git fetch --no-tags origin "${request_ref}"
          [[ "$(git rev-parse FETCH_HEAD)" == "${tag_object}" ]]
          git merge-base --is-ancestor "${target_commit}" "${GITHUB_SHA}"
          version="$(git show "${target_commit}:Cargo.toml" | python3 -c \
            'import sys,tomllib; print(tomllib.load(sys.stdin.buffer)["workspace"]["package"]["version"])')"
          [[ "${RELEASE_TAG}" == "v${version}" ]]
          if git show-ref --verify --quiet "${official_ref}"; then
            [[ "$(git rev-parse --verify "${official_ref}")" == "${tag_object}" ]]
          else
            git update-ref "${official_ref}" "${tag_object}" 0000000000000000000000000000000000000000
          fi
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "tag_object=${tag_object}"
            echo "base_commit=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require an enrolled FIDO2 signature on the exact object
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          BASE_COMMIT: ${{ steps.request.outputs.base_commit }}
        run: |
          cargo run --release --locked -p agent-guard --bin dotagent -- verify-ring0-ratchet \
            --verify-release-tag "${RELEASE_TAG}" --base "${BASE_COMMIT}"

  promote-release-request:
    name: Promote the verified tag after release approval
    needs: validate-release-request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Check that the verified trust base is still current
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: ${{ needs.validate-release-request.outputs.base_commit }}
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_base}" != "${BASE_COMMIT}" ]]; then
            echo "::error::Main advanced during release approval. Dispatch again to reverify the signature."
            exit 1
          fi

      - name: Mint a repository-scoped release promoter token
        id: promoter
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PROMOTER_APP_ID }}
          private-key: ${{ secrets.PROMOTER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the official ref for the original signed object
        env:
          GH_TOKEN: ${{ steps.promoter.outputs.token }}
          RELEASE_TAG: ${{ needs.validate-release-request.outputs.release_tag }}
          TAG_OBJECT: ${{ needs.validate-release-request.outputs.tag_object }}
        run: |
          set -euo pipefail
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field "ref=refs/tags/${RELEASE_TAG}" --raw-field "sha=${TAG_OBJECT}" >/dev/null; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            [[ "${existing}" == "${TAG_OBJECT}" ]]
          fi

  verify-release-gate:
    name: Pre-Release Security & Manifest Gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-release"
      GIT_AUTHOR_EMAIL: "release@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-release"
      GIT_COMMITTER_EMAIL: "dotagent-release"
    steps:
      - name: Checkout tag & main ancestry (zero persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Require a GitHub-verified annotated tag whose commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha')"
          test "${ref%% *}" = "tag"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref#* }" --jq '.verification.verified')"
          test "${verified}" = "true"

      - name: Verify release tag matches Cargo.toml SemVer & descends from origin/main
        shell: bash
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/main; then
            echo "UNMERGED_RELEASE_TAG_FORBIDDEN: ${TAG_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          VER="$(python3 -c 'import re,sys,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?", v); print(v)')"
          EXPECTED_TAG="v${VER}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "TAG_VERSION_MISMATCH: tag '${GITHUB_REF_NAME}' != Cargo.toml '${EXPECTED_TAG}'" >&2
            exit 1
          fi

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Install stable & MSRV 1.88.0 Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
          rustup default stable

      - name: Audit supply chain (SHA-256-pinned cargo-deny 0.22.0)
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          python3 - "${ARCHIVE}" <<'PY'
          import hashlib, sys, urllib.request
          url = "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          expected = "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
          data = urllib.request.urlopen(url, timeout=60).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"cargo-deny SHA-256 mismatch: expected {expected}, got {actual}")
          with open(sys.argv[1], "wb") as fh:
              fh.write(data)
          PY
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny" check advisories licenses bans sources

      - name: Require an enrolled FIDO2 signature on the release tag
        run: |
          cargo run --release --locked -p agent-guard --bin dotagent -- verify-ring0-ratchet \
            --verify-release-tag "${GITHUB_REF_NAME}" --base refs/remotes/origin/main

      - name: Run fmt, strict clippy, MSRV 1.88 check, full test & fuzz suite, compiler verify, and repo audit
        run: |
          cargo fmt --all -- --check
          cargo +1.88.0 check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --release --locked -p dotagent-compiler -- verify .
          cargo run --release --locked -p agent-guard --bin dotagent -- audit-repo .

      - name: Run packaging tests (installer, repackager, ceremony script)
        run: |
          python3 -B -m unittest discover -s tests/packaging -v
          shellcheck packaging/install.sh.in scripts/sign-release-yk.sh scripts/activate-local.sh

  build-archives:
    name: Build & Smoke-Test Archive (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            use_musl_tools: "true"
            expect_mode: landlock
            runner_prefix: ""
            dual_repro: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            use_musl_tools: "true"
            expect_mode: landlock
            runner_prefix: ""
            dual_repro: "false"
          - os: macos-15
            target: aarch64-apple-darwin
            use_musl_tools: "false"
            expect_mode: seatbelt
            runner_prefix: ""
            dual_repro: "false"
          - os: macos-15
            target: x86_64-apple-darwin
            use_musl_tools: "false"
            expect_mode: seatbelt
            runner_prefix: "arch -x86_64"
            dual_repro: "false"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools on Linux
        if: matrix.use_musl_tools == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Ensure Rosetta 2 is functional for Intel macOS cleanroom smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Install Rust target (${{ matrix.target }})
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${MATRIX_TARGET}"

      - name: Build locked release workspace binaries with deterministic path remapping
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
          cargo build --release --locked --workspace --target "${MATRIX_TARGET}"

      - name: Package deterministic release archive & run sterile clean-room smoke test
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_EXPECT_MODE: ${{ matrix.expect_mode }}
          MATRIX_RUNNER_PREFIX: ${{ matrix.runner_prefix }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${MATRIX_TARGET}"
          OUT_TAR="release-out/${PKG}.tar.gz"
          bash scripts/package-release-archive.sh \
            --target "${MATRIX_TARGET}" \
            --tag "${TAG}" \
            --out "${OUT_TAR}"

          SMOKE_ARGS=(--archive "${OUT_TAR}" --expect-mode "${MATRIX_EXPECT_MODE}")
          if [[ -n "${MATRIX_RUNNER_PREFIX}" ]]; then
            SMOKE_ARGS+=(--runner-prefix "${MATRIX_RUNNER_PREFIX}")
          fi
          bash scripts/cleanroom-smoke-test.sh "${SMOKE_ARGS[@]}"

      - name: Verify dual-directory bit-for-bit reproducibility on x86_64-unknown-linux-musl
        if: matrix.dual_repro == 'true'
        shell: bash
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${MATRIX_TARGET}"
          ALT_DIR="${RUNNER_TEMP}/repro-check/deep/nested/repo"
          mkdir -p "${ALT_DIR}"
          tar -cf - --exclude='./.git' --exclude='./target' --exclude='./release-out' . | tar -xf - -C "${ALT_DIR}"
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          (
            cd "${ALT_DIR}"
            export RUSTFLAGS="--remap-path-prefix=${ALT_DIR}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
            cargo build --release --locked --workspace --target "${MATRIX_TARGET}"
            bash scripts/package-release-archive.sh \
              --target "${MATRIX_TARGET}" \
              --tag "${TAG}" \
              --out "${RUNNER_TEMP}/alt-${PKG}.tar.gz"
          )
          SHA_PRIMARY="$(sha256sum "release-out/${PKG}.tar.gz" | awk '{print $1}')"
          SHA_ALT="$(sha256sum "${RUNNER_TEMP}/alt-${PKG}.tar.gz" | awk '{print $1}')"
          if [[ "${SHA_PRIMARY}" != "${SHA_ALT}" ]]; then
            echo "RELEASE_REPRODUCIBILITY_MISMATCH: ${SHA_PRIMARY} != ${SHA_ALT}" >&2
            exit 1
          fi

      - name: Upload verified target archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: release-out/*.tar.gz
          if-no-files-found: error

  repackage-ecosystem:
    name: Repackage (installer, wheels, npm, Homebrew, deb/rpm/apk)
    needs: build-archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Download all target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: archives
          merge-multiple: true

      - name: Install nfpm (module-proxy checksum verified, no curl)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0

      - name: Repackage without recompiling
        run: |
          set -euo pipefail
          python3 -B packaging/repackage.py \
            --archives archives \
            --tag "${GITHUB_REF_NAME}" \
            --signers packaging/release-signer.pub \
            --out release-extra \
            --nfpm "$(go env GOPATH)/bin/nfpm"
          cat release-extra/SHA256SUMS

      - name: Upload repackaged assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-extra
          path: release-extra
          if-no-files-found: error

  publish-attested-release:
    name: SHA256SUMS, SLSA Provenance, & GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: repackage-ecosystem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Re-verify main branch ancestry prior to release publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Assert tagged commit is merged on origin/main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/main

      - name: Download all smoke-tested target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: release
          merge-multiple: true

      - name: Download repackaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extra
          path: extra

      - name: Assemble flat release directory and re-verify SHA256SUMS
        run: |
          set -euo pipefail
          find extra -mindepth 2 -type f -exec cp -t release {} +
          cp extra/SHA256SUMS release/SHA256SUMS
          cd release
          sha256sum -c SHA256SUMS
          ls -1

      - name: Generate SLSA build provenance attestation (every asset)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --title "dotagent ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  verify-published-release:
    name: Post-Publish SLSA & dotagent self-verify (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-attested-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            native_target: x86_64-unknown-linux-musl
          - os: macos-15
            native_target: aarch64-apple-darwin
    steps:
      - name: Verify SLSA attestations on all published assets & run dotagent self-verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NATIVE_TARGET: ${{ matrix.native_target }}
          SIGNER_WF: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          set -euo pipefail
          VERIFY_DIR="${RUNNER_TEMP}/post-release-verify"
          mkdir -p "${VERIFY_DIR}/unpacked"
          cd "${VERIFY_DIR}"

          gh release download "${TAG}" --repo "${REPO_FULL}" -p "dotagent-${TAG}-*.tar.gz" -p "SHA256SUMS"
          gh attestation verify "SHA256SUMS" --repo "${REPO_FULL}" --signer-workflow "${SIGNER_WF}" >/dev/null

          ALL_TARGETS=(
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            aarch64-apple-darwin
            x86_64-apple-darwin
          )
          for t in "${ALL_TARGETS[@]}"; do
            f="dotagent-${TAG}-${t}.tar.gz"
            [[ -f "${f}" ]] || { echo "MISSING_RELEASE_ASSET: ${f}" >&2; exit 1; }
            gh attestation verify "${f}" --repo "${REPO_FULL}" --signer-workflow "${SIGNER_WF}" --format json > "attestation-${t}.json"
          done

          shasum -a 256 -c SHA256SUMS

          NATIVE_PKG="dotagent-${TAG}-${NATIVE_TARGET}"
          tar -xzf "${NATIVE_PKG}.tar.gz" -C "${VERIFY_DIR}/unpacked"
          DOTAGENT_BIN="${VERIFY_DIR}/unpacked/${NATIVE_PKG}/bin/dotagent"

          for t in "${ALL_TARGETS[@]}"; do
            f="dotagent-${TAG}-${t}.tar.gz"
            python3 - "attestation-${t}.json" "statement-${t}.json" <<'PY'
          import base64, json, sys
          bundles = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert isinstance(bundles, list) and len(bundles) >= 1 and isinstance(bundles[0], dict), "invalid attestation bundle"
          b0 = bundles[0]
          stmt = (b0.get("verificationResult") or {}).get("statement")
          if not isinstance(stmt, dict):
              dsse = (b0.get("bundle") or {}).get("dsseEnvelope") or b0.get("dsseEnvelope")
              assert isinstance(dsse, dict) and isinstance(dsse.get("payload"), str), "missing dsseEnvelope payload"
              stmt = json.loads(base64.b64decode(dsse["payload"]).decode("utf-8"))
          assert isinstance(stmt, dict) and isinstance(stmt.get("subject"), list), "invalid SLSA statement"
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              json.dump(stmt, out)
          PY
            "${DOTAGENT_BIN}" self-verify \
              --sums "${VERIFY_DIR}/SHA256SUMS" \
              --subject "${VERIFY_DIR}/${f}" \
              --provenance "${VERIFY_DIR}/statement-${t}.json"
          done

  publish-ghcr:
    name: Publish OCI image (ghcr.io, provenance attested)
    needs: publish-attested-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Download Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*-linux-musl
          path: archives
          merge-multiple: true

      - name: Verify build provenance of every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for asset in archives/*.tar.gz; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            count=$((count + 1))
          done
          test "${count}" -gt 0

      - name: Stage /opt/dotagent per architecture via dotagent fleet build-image
        run: |
          set -euo pipefail
          mkdir -p unpacked
          for archive in archives/*.tar.gz; do tar -xzf "${archive}" -C unpacked --no-same-owner; done
          runner="unpacked/dotagent-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl/bin/dotagent"
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch="${pair%%:*}"
            root="unpacked/dotagent-${GITHUB_REF_NAME}-${pair#*:}"
            "${runner}" fleet build-image \
              --out "oci-stage/stage-${arch}/opt/dotagent" \
              --dotagent-root "${root}" \
              --bin-dir "${root}/bin"
          done

      - name: Build and push multi-arch image
        id: build
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --name dotagent --driver docker-container --use
          docker buildx build \
            --file packaging/Containerfile.oci \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/susanbdev/dotagent:${GITHUB_REF_NAME#v}" \
            --metadata-file build-metadata.json \
            --push \
            oci-stage
          digest="$(python3 -B -c 'import json; print(json.load(open("build-metadata.json"))["containerimage.digest"])')"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest image provenance (pushed to registry)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517eb71b # v2
        with:
          subject-name: ghcr.io/susanbdev/dotagent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-pypi:
    name: Publish wheels to PyPI (Trusted Publishing)
    needs: publish-attested-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download repackaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-extra
          path: extra

      - name: Verify build provenance of every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for asset in extra/pypi/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            count=$((count + 1))
          done
          test "${count}" -gt 0

      - name: Publish with keyless OIDC and PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: extra/pypi
          attestations: true
          skip-existing: true

  publish-npm:
    name: Publish packages to npm (Trusted Publishing + provenance)
    needs: publish-attested-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download repackaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-extra
          path: extra

      - name: Verify build provenance of every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for asset in extra/npm/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            count=$((count + 1))
          done
          test "${count}" -gt 0

      - name: Install Node 24 (npm >= 11.5.1 for OIDC trusted publishing)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform packages first, root package last (idempotent)
        run: |
          set -euo pipefail
          publish_new() {
            pkg="$1"
            name="$(tar -xOzf "${pkg}" package/package.json | python3 -B -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
            version="$(tar -xOzf "${pkg}" package/package.json | python3 -B -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version}: already published"
              return 0
            fi
            npm publish "${pkg}" --provenance --access public --ignore-scripts
          }
          for pkg in extra/npm/susanbdev-dotagent-*-*.tgz; do publish_new "${pkg}"; done
          for pkg in extra/npm/susanbdev-dotagent-[0-9]*.tgz; do publish_new "${pkg}"; done

  publish-homebrew:
    name: Update Homebrew tap
    needs: publish-attested-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-homebrew
    permissions:
      contents: read
    steps:
      - name: Download repackaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-extra
          path: extra

      - name: Verify build provenance of every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=0
          for asset in extra/brew/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            count=$((count + 1))
          done
          test "${count}" -gt 0

      - name: Mint short-lived tap token (GitHub App, scoped to homebrew-tap only)
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_KEY }}
          owner: susanbdev
          repositories: homebrew-tap

      - name: Commit formula to tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: dotagent-release
          GIT_AUTHOR_EMAIL: release@susanb.dev
          GIT_COMMITTER_NAME: dotagent-release
          GIT_COMMITTER_EMAIL: release@susanb.dev
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone susanbdev/homebrew-tap tap
          mkdir -p tap/Formula
          cp extra/brew/dotagent.rb tap/Formula/dotagent.rb
          cd tap
          git add Formula/dotagent.rb
          git commit -m "dotagent ${GITHUB_REF_NAME}"
          git push origin HEAD
