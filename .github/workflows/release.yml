name: Verifiable Release & SLSA Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-gate:
    name: Pre-Release Security & Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-release"
      GIT_AUTHOR_EMAIL: "release@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-release"
      GIT_COMMITTER_EMAIL: "release@dotagent.local"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Install stable & MSRV 1.88.0 Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
          rustup default stable

      - name: Audit supply chain (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories licenses bans sources

      - name: Run fmt, strict clippy, MSRV 1.88 check, full test & fuzz suite, compiler verify, and repo audit
        run: |
          cargo fmt --all -- --check
          cargo +1.88.0 check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --release --locked -p dotagent-compiler -- verify .
          cargo run --release --locked -p agent-guard --bin dotagent -- audit-repo .

  build-archives:
    name: Build Archive (${{ matrix.target }})
    needs: verify-release-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_musl_tools: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            use_musl_tools: "true"
          - os: macos-latest
            target: x86_64-apple-darwin
            use_musl_tools: "false"
          - os: macos-latest
            target: aarch64-apple-darwin
            use_musl_tools: "false"
    steps:
      - name: Checkout tag (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools on Linux
        if: matrix.use_musl_tools == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust target (${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build locked release workspace binaries with deterministic path remapping
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
          cargo build --release --locked --workspace --target "${{ matrix.target }}"

      - name: Package deterministic bit-for-bit reproducible release tarball
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dotagent-${TAG}-${{ matrix.target }}"
          STAGE="dist-release/${PKG}"
          mkdir -p "${STAGE}/bin"
          for bin in dotagent agent-guard agent-guard-sh dotagent-compiler swarm-tool dotagent-harness; do
            cp "target/${{ matrix.target }}/release/${bin}" "${STAGE}/bin/${bin}"
            chmod 0555 "${STAGE}/bin/${bin}"
          done
          cp -R dist profiles skills "${STAGE}/"
          cp AGENTS.md README.md THREAT_MODEL.md SECURITY.md CHANGELOG.md spec.md "${STAGE}/"
          mkdir -p release-out
          python3 - "${STAGE}" "${PKG}" "release-out/${PKG}.tar.gz" <<'PY'
          import gzip, os, stat, sys, tarfile
          stage_dir, pkg_name, out_tar_gz = sys.argv[1], sys.argv[2], sys.argv[3]
          entries = []
          for root, dirs, files in os.walk(stage_dir, followlinks=False):
              dirs.sort()
              files.sort()
              rel_root = os.path.relpath(root, os.path.dirname(stage_dir))
              entries.append((root, rel_root, True))
              for f in files:
                  full = os.path.join(root, f)
                  entries.append((full, os.path.join(rel_root, f), False))
          entries.sort(key=lambda item: item[1])
          with open(out_tar_gz, "wb") as raw_fh:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw_fh, mtime=0) as gz_fh:
                  with tarfile.open(mode="w", fileobj=gz_fh, format=tarfile.PAX_FORMAT) as tf:
                      for full, arcname, is_dir in entries:
                          st = os.lstat(full)
                          if stat.S_ISLNK(st.st_mode):
                              raise SystemExit(f"forbidden symlink in release stage: {full}")
                          ti = tarfile.TarInfo(name=arcname.replace(os.sep, "/"))
                          ti.uid = 0
                          ti.gid = 0
                          ti.uname = ""
                          ti.gname = ""
                          ti.mtime = 0
                          if is_dir and stat.S_ISDIR(st.st_mode):
                              ti.type = tarfile.DIRTYPE
                              ti.mode = 0o555
                              tf.addfile(ti)
                          elif stat.S_ISREG(st.st_mode):
                              ti.type = tarfile.REGTYPE
                              ti.size = st.st_size
                              ti.mode = 0o555 if (st.st_mode & 0o111) else 0o444
                              with open(full, "rb") as src_fh:
                                  tf.addfile(ti, src_fh)
                          else:
                              raise SystemExit(f"forbidden non-regular file in release stage: {full}")
          PY

      - name: Upload target archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: release-out/*.tar.gz
          if-no-files-found: error

  publish-attested-release:
    name: SHA256SUMS, SLSA Provenance, & GitHub Release
    needs: build-archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum dotagent-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517eb71b # v2
        with:
          subject-path: |
            artifacts/dotagent-*.tar.gz
            artifacts/SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/dotagent-*.tar.gz \
            artifacts/SHA256SUMS \
            --title "dotagent ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
