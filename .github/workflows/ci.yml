name: Zero-Trust Guardrail CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-guardrails:
    name: Security Kernel & Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-ci"
      GIT_AUTHOR_EMAIL: "ci@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-ci"
      GIT_COMMITTER_EMAIL: "ci@dotagent.local"
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify strict lints, forbid(unsafe_code), & zero-panic kernel (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit, 305+ adversarial corpus, Swarm v2, & 5,300+ property fuzz suites
        run: cargo test --workspace

      - name: Verify deterministic multi-harness bundles & SHA-256 lock manifest
        run: cargo run --release -p dotagent-compiler -- verify .

      - name: Run static zero-trust repository & workflow audit
        run: cargo run --release -p agent-guard --bin dotagent -- audit-repo .

      - name: Run release-profile latency & throughput microbenchmarks
        run: |
          cargo build --release --workspace
          ./target/release/dotagent-harness bench --quick

  msrv-1-85:
    name: MSRV 1.85.0 Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install exact Rust 1.85.0 (Edition 2024 MSRV)
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check entire workspace against Rust 1.85.0
        run: cargo +1.85.0 check --workspace --all-targets
