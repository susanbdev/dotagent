name: Zero-Trust Guardrail CI

on:
  push:
    branches: ["**"]
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  verify-guardrails:
    name: Security Kernel & Harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_AUTHOR_NAME: "dotagent-ci"
      GIT_AUTHOR_EMAIL: "ci@dotagent.local"
      GIT_COMMITTER_NAME: "dotagent-ci"
      GIT_COMMITTER_EMAIL: "ci@dotagent.local"
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Apply hardened global Git configuration
        run: cp dist/gitconfig.hardened ~/.gitconfig

      - name: Prefer trusted system Git on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          git_bin="${RUNNER_TEMP}/dotagent-system-git"
          install -d -m 0755 "${git_bin}"
          ln -s /usr/bin/git "${git_bin}/git"
          echo "${git_bin}" >> "${GITHUB_PATH}"

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo workspace build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify strict lints, forbid(unsafe_code), & zero-panic kernel (cargo clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit, 305+ adversarial corpus, Swarm v2, & 5,300+ property fuzz suites
        run: cargo test --workspace --locked

      - name: Run packaging suite (installer, repackager, ceremony, wheels, npm shims)
        run: python3 -B -m unittest discover -s tests/packaging

      - name: Build release binaries, verify bundles, repo audit, StopReceipt, microbench, & sterile cleanroom tarball
        shell: bash
        run: |
          cargo build --release --locked --workspace
          ./target/release/dotagent-compiler verify .
          ./target/release/dotagent audit-repo .
          bash -n scripts/*.sh
          bash scripts/test-delivery-scripts.sh
          HOST_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "target/${HOST_TRIPLE}/release"
          for bin in dotagent agent-guard agent-guard-sh dotagent-compiler swarm-tool dotagent-harness; do
            cp "target/release/${bin}" "target/${HOST_TRIPLE}/release/${bin}"
          done
          ARCHIVE_PATH="${RUNNER_TEMP}/dotagent-v0.0.0-ci-${HOST_TRIPLE}.tar.gz"
          bash scripts/package-release-archive.sh --target "${HOST_TRIPLE}" --tag "v0.0.0-ci" --out "${ARCHIVE_PATH}"
          bash scripts/cleanroom-smoke-test.sh --archive "${ARCHIVE_PATH}"
          rm -f "${ARCHIVE_PATH}"
          REPRO_DIR="${RUNNER_TEMP}/repro-dual-dir"
          rm -rf "${REPRO_DIR}"
          mkdir -p "${REPRO_DIR}"
          git archive HEAD | tar -x -C "${REPRO_DIR}"
          ./target/release/dotagent-compiler build "${REPRO_DIR}"
          diff -u dist-verify/manifest.sha256 "${REPRO_DIR}/dist-verify/manifest.sha256"
          rm -rf "${REPRO_DIR}"
          openssl genpkey -algorithm ED25519 -out "${RUNNER_TEMP}/ci_receipt_ed25519.pem"
          SEED_HEX="$(openssl pkey -in "${RUNNER_TEMP}/ci_receipt_ed25519.pem" -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          PUBKEY_HEX="$(openssl pkey -in "${RUNNER_TEMP}/ci_receipt_ed25519.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          rm -f "${RUNNER_TEMP}/ci_receipt_ed25519.pem"
          DOTAGENT_RECEIPT_SEED_HEX="${SEED_HEX}" \
            ./target/release/dotagent on-stop --receipt-out target/ci.receipt.json
          ./target/release/dotagent verify-receipt target/ci.receipt.json --repo . \
            --pubkey "${PUBKEY_HEX}"
          ./target/release/dotagent-harness bench --quick
          chmod -R u+w target/test-workspaces target/cleanroom-run-* 2>/dev/null || true
          rm -rf target/test-workspaces target/tbench-* target/cleanroom-run-* target/ci.receipt.json || true

      - name: Build and verify macOS universal preview
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          OTHER_TARGET: ${{ runner.arch == 'ARM64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
        run: |
          set -euo pipefail
          rustup target add "${OTHER_TARGET}"
          cargo build --release --locked --workspace --target "${OTHER_TARGET}"
          ./target/release/dotagent-compiler package-macos-preview \
            --native ./target/release/dotagent \
            --other "./target/${OTHER_TARGET}/release/dotagent" \
            --commit "${GITHUB_SHA}" \
            --out-dir "${RUNNER_TEMP}/dotagent-macos-preview"

      - name: Exercise the official Rust archive path for both macOS architectures
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          OTHER_TARGET: ${{ runner.arch == 'ARM64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/macos-release-check"
          mkdir -p "${root}"
          git archive HEAD | tar -x -C "${root}"
          compiler="${GITHUB_WORKSPACE}/target/release/dotagent-compiler"
          native_target="$(rustc -vV | sed -n 's/^host: //p')"
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          for triple in "${native_target}" "${OTHER_TARGET}"; do
            mkdir -p "${root}/target/${triple}/release"
            for bin in dotagent agent-guard agent-guard-sh dotagent-compiler swarm-tool dotagent-harness; do
              binary="${root}/target/${triple}/release/${bin}"
              cp "target/${triple}/release/${bin}" "${binary}"
              codesign --force --sign - --timestamp=none "${binary}"
            done
            pkg="dotagent-v0.0.0-ci-${triple}"
            archive="${root}/${pkg}.tar.gz"
            "${compiler}" package-release-archive --repo-root "${root}" --target "${triple}" --tag v0.0.0-ci --out "${archive}"
            "${compiler}" package-release-archive --repo-root "${root}" --target "${triple}" --tag v0.0.0-ci --out "${root}/repro-${pkg}.tar.gz"
            digest="$("${compiler}" hash-release-file "${archive}")"
            "${compiler}" verify-file-sha256 "${root}/repro-${pkg}.tar.gz" "${digest}"
            "${compiler}" unpack-release-archive --archive "${archive}" --target "${triple}" --tag v0.0.0-ci --out-dir "${root}/unpacked"
            for bin in dotagent agent-guard agent-guard-sh dotagent-compiler swarm-tool dotagent-harness; do
              codesign --verify --strict "${root}/unpacked/${pkg}/bin/${bin}"
              cmp "${root}/target/${triple}/release/${bin}" "${root}/unpacked/${pkg}/bin/${bin}"
            done
            cpu="${triple%%-*}"
            if [[ "${cpu}" == aarch64 ]]; then cpu=arm64; fi
            arch "-${cpu}" "${root}/unpacked/${pkg}/bin/dotagent" --version
            if [[ "${triple}" == x86_64-apple-darwin ]]; then
              bash scripts/cleanroom-smoke-test.sh --archive "${archive}" --expect-mode seatbelt \
                --runner-prefix 'arch -x86_64' --compiler "${compiler}" --target "${triple}" --tag v0.0.0-ci
            fi
            printf '%s  %s\n' "${digest}" "${pkg}.tar.gz"
          done

      - name: Upload macOS universal preview
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotagent-macos-universal
          path: ${{ runner.temp }}/dotagent-macos-preview/dotagent-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 7

  supply-chain-deny:
    name: Supply-Chain Advisory & License Gate (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install SHA-256-pinned cargo-deny 0.22.0 & audit advisories, licenses, bans, and sources
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          python3 - "${ARCHIVE}" <<'PY'
          import hashlib, sys, urllib.request
          url = "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz"
          expected = "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
          data = urllib.request.urlopen(url, timeout=60).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"cargo-deny SHA-256 mismatch: expected {expected}, got {actual}")
          with open(sys.argv[1], "wb") as fh:
              fh.write(data)
          PY
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny" check advisories licenses bans sources

  container-cleanroom-matrix:
    name: Container Cleanroom Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools & x86_64-unknown-linux-musl Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Cache musl Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ runner.os }}-musl-cleanroom-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-musl-cleanroom-

      - name: Build static musl release archive & execute 3 locked-down OCI container regimes
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --workspace --target x86_64-unknown-linux-musl
          ARCHIVE="${RUNNER_TEMP}/dotagent-v0.0.0-ci-x86_64-unknown-linux-musl.tar.gz"
          bash scripts/package-release-archive.sh \
            --target x86_64-unknown-linux-musl \
            --tag "v0.0.0-ci" \
            --out "${ARCHIVE}"

          docker build -t dotagent-ci-alpine - <<'DOCKERFILE'
          FROM alpine:3.21@sha256:2d8a11041a92082ba21e364dec73559ce44f1de69b60fa68315f6d3774e59117
          RUN apk add --no-cache bash git
          USER 65532:65532
          DOCKERFILE

          docker build -t dotagent-ci-debian - <<'DOCKERFILE'
          FROM debian:12-slim@sha256:c67e92c8099ba22853ab4cfda7cfb494d253d6012ca82dee98ba8976772af018
          RUN apt-get update && apt-get install -y --no-install-recommends bash git python3 ca-certificates && rm -rf /var/lib/apt/lists/*
          USER 65532:65532
          DOCKERFILE

          COMMON_DOCKER_ARGS=(
            --rm
            --network=none
            --cap-drop=ALL
            --security-opt=no-new-privileges
            --read-only
            --tmpfs /work:rw,exec,nosuid,size=256m,mode=1777
            -v "${ARCHIVE}:/archive/dotagent.tar.gz:ro"
            -v "${GITHUB_WORKSPACE}/scripts/cleanroom-smoke-test.sh:/usr/local/bin/cleanroom-smoke-test.sh:ro"
            -w /work
          )

          echo "=== [1/3] alpine:3.21 pure musl locked-down cleanroom ==="
          docker run "${COMMON_DOCKER_ARGS[@]}" dotagent-ci-alpine \
            bash /usr/local/bin/cleanroom-smoke-test.sh \
              --archive /archive/dotagent.tar.gz \
              --expect-mode landlock \
              --work-root /work/run

          echo "=== [2/3] debian:12-slim minimal glibc locked-down cleanroom ==="
          docker run "${COMMON_DOCKER_ARGS[@]}" dotagent-ci-debian \
            bash /usr/local/bin/cleanroom-smoke-test.sh \
              --archive /archive/dotagent.tar.gz \
              --expect-mode landlock \
              --work-root /work/run

          echo "=== [3/3] unprivileged seccomp-only (Moby default SCMP_ACT_ERRNO allowlist + Landlock denied) ==="
          SECCOMP_NO_LL="${GITHUB_WORKSPACE}/scripts/seccomp-no-landlock.json"
          python3 - "${SECCOMP_NO_LL}" <<'PY'
          import json, sys

          seccomp = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          assert seccomp.get("defaultAction") == "SCMP_ACT_ERRNO", f"expected SCMP_ACT_ERRNO, got {seccomp.get('defaultAction')}"
          landlock_calls = {"landlock_create_ruleset", "landlock_add_rule", "landlock_restrict_self"}
          uncond_forbidden = landlock_calls | {"bpf", "kexec_load", "kexec_file_load", "mount", "pivot_root", "process_vm_readv", "process_vm_writev", "ptrace", "setns", "umount2", "unshare"}
          for rule in seccomp.get("syscalls", []):
              if rule.get("action") == "SCMP_ACT_ALLOW":
                  assert not landlock_calls.intersection(rule.get("names", [])), "Landlock remained allowed"
                  if not (rule.get("includes") or {}).get("caps"):
                      overlap = uncond_forbidden.intersection(rule.get("names", []))
                      assert not overlap, f"dangerous syscall unconditionally allowed: {overlap}"
          PY

          docker run "${COMMON_DOCKER_ARGS[@]}" \
            --security-opt "seccomp=${SECCOMP_NO_LL}" \
            dotagent-ci-debian \
            bash /usr/local/bin/cleanroom-smoke-test.sh \
              --archive /archive/dotagent.tar.gz \
              --expect-mode seccomp-only \
              --work-root /work/run

  reproducibility-and-supply-chain:
    name: Dual-Directory Reproducibility Proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install musl-tools & x86_64-unknown-linux-musl Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Dual-directory bit-for-bit deterministic tarball reproducibility proof
        shell: bash
        env:
          LC_ALL: C
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          DIR_A="${RUNNER_TEMP}/repro-a/repo"
          DIR_B="${RUNNER_TEMP}/repro-b/deep/nested/repo"
          mkdir -p "${DIR_A}" "${DIR_B}"
          tar -cf - --exclude='./.git' --exclude='./target' . | tar -xf - -C "${DIR_A}"
          tar -cf - --exclude='./.git' --exclude='./target' . | tar -xf - -C "${DIR_B}"

          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"

          (
            cd "${DIR_A}"
            export RUSTFLAGS="--remap-path-prefix=${DIR_A}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
            cargo build --release --locked --workspace --target x86_64-unknown-linux-musl
            bash scripts/package-release-archive.sh \
              --target x86_64-unknown-linux-musl \
              --tag "v0.0.0-repro" \
              --out "${RUNNER_TEMP}/repro-a.tar.gz"
          )

          (
            cd "${DIR_B}"
            export RUSTFLAGS="--remap-path-prefix=${DIR_B}=/dotagent --remap-path-prefix=${CARGO_DIR}=/cargo"
            cargo build --release --locked --workspace --target x86_64-unknown-linux-musl
            bash scripts/package-release-archive.sh \
              --target x86_64-unknown-linux-musl \
              --tag "v0.0.0-repro" \
              --out "${RUNNER_TEMP}/repro-b.tar.gz"
          )

          SHA_A="$(sha256sum "${RUNNER_TEMP}/repro-a.tar.gz" | awk '{print $1}')"
          SHA_B="$(sha256sum "${RUNNER_TEMP}/repro-b.tar.gz" | awk '{print $1}')"
          echo "repro-a sha256: ${SHA_A}"
          echo "repro-b sha256: ${SHA_B}"
          if [[ "${SHA_A}" != "${SHA_B}" ]]; then
            echo "REPRODUCIBILITY_MISMATCH: ${SHA_A} != ${SHA_B}" >&2
            exit 1
          fi

  kani-formal-proofs:
    name: Kani Bounded Model Checking Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Kani 0.68.0 verifier & CBMC bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: ${{ runner.os }}-kani-0.68.0-v1

      - name: Install SHA-256-pinned Kani 0.68.0 bundle & verify proofs on agent-guard
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-kani >/dev/null 2>&1 || [ ! -d "${HOME}/.kani/kani-0.68.0" ]; then
            cargo +stable install --locked --version 0.68.0 kani-verifier
            BUNDLE="${RUNNER_TEMP}/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz"
            python3 - "${BUNDLE}" <<'PY'
          import hashlib, sys, urllib.request
          url = "https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz"
          expected = "32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3"
          data = urllib.request.urlopen(url, timeout=120).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"kani bundle SHA-256 mismatch: expected {expected}, got {actual}")
          with open(sys.argv[1], "wb") as fh:
              fh.write(data)
          PY
            cargo-kani setup --use-local-bundle "${BUNDLE}"
            rm -f "${BUNDLE}"
          else
            TC_VER="$(tr -d ' \r\n' < "${HOME}/.kani/kani-0.68.0/rust-toolchain-version")"
            case "${TC_VER}" in
              *[!0-9A-Za-z._-]*|"") cargo-kani setup ;;
              *) rustup toolchain install "${TC_VER}" --profile minimal || cargo-kani setup ;;
            esac
          fi
          cargo kani -p agent-guard

  msrv-1-88:
    name: MSRV 1.88.0 Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Checkout repository (zero persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install exact Rust 1.88.0 (Edition 2024 + let_chains MSRV)
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Cache MSRV 1.88.0 check artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-msrv-1-88-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1-88-

      - name: Check entire workspace against Rust 1.88.0
        run: cargo +1.88.0 check --workspace --all-targets --locked

  ring0-constitutional-ratchet:
    name: Ring-0 Constitutional Ratchet
    # Direct pushes to main are blocked by the org ruleset (PR-only); the ratchet is enforced on
    # every pull request, pull request review, and non-main branch push against origin/main.
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check human owner GitHub PR review approval
        id: owner_review
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["REPO_FULL"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          pr_base_ref = os.environ["PR_BASE_REF"]
          pr_num = int(os.environ["PR_NUMBER"])
          head_sha = os.environ["PR_HEAD_SHA"]
          if pr_base_ref != default_branch:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as fh:
                  fh.write("approved=false\n")
              raise SystemExit(0)
          out = subprocess.check_output(
              ["gh", "api", "--paginate", "--slurp", f"repos/{repo}/pulls/{pr_num}/reviews"],
              text=True,
          )
          pages = json.loads(out) if out.strip() else []
          reviews = [r for p in pages for r in (p if isinstance(p, list) else [p])]
          latest = None
          for rev in reviews:
              u = rev.get("user") or {}
              rstate = str(rev.get("state", "")).upper()
              if rstate not in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                  continue
              if u.get("login") == "susanbeasles" and str(u.get("type", "")).lower() == "user" and rev.get("commit_id") == head_sha:
                  if latest is None or int(rev.get("id", 0)) >= int(latest.get("id", 0)):
                      latest = rev
          approved = bool(latest and str(latest.get("state", "")).upper() == "APPROVED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as fh:
              fh.write(f"approved={'true' if approved else 'false'}\n")
          PY

      - name: Checkout PR head (full history for merge-base & SSH signature verification)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Enforce Ring-0 corpus ratchet & autonomous-bot allowlist confinement
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.repository.default_branch || 'main' }}
          EVENT_ACTOR: ${{ github.actor }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
          OWNER_PR_APPROVED: ${{ steps.owner_review.outputs.approved || 'false' }}
        run: |
          set -euo pipefail
          BASE_OID="$(git rev-parse --verify "origin/${BASE_REF}^{commit}")"
          TRUSTED="${RUNNER_TEMP}/trusted-base"
          git worktree add --detach "${TRUSTED}" "${BASE_OID}"
          for f in .cargo/config .cargo/config.toml rust-toolchain rust-toolchain.toml; do
            if [ -e "${TRUSTED}/${f}" ] || [ -e "${GITHUB_WORKSPACE}/${f}" ]; then
              echo "::error::Refusing to run ratchet: forbidden toolchain override ${f} present"
              exit 1
            fi
          done
          if git -C "${TRUSTED}" grep -q -F 'verify-ring0-ratchet' -- crates/agent-guard/src/cli.rs; then
            (cd "${TRUSTED}" && CARGO_TARGET_DIR="${RUNNER_TEMP}/trusted-target" \
              cargo build --locked -p agent-guard --bin dotagent)
            case "${PR_AUTHOR_TYPE}:${CHANGE_AUTHOR}:${PR_HEAD_REF}" in
              [Bb]ot:*|*"[bot]:"*|*:friction-loop/*|*:agent-feedback/*|*:auto/*)
                "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
                  --base "origin/${BASE_REF}" --require-ratchet
                ;;
              *)
                if ! git diff --quiet "${BASE_OID}" HEAD -- config/allowed_human_signers scripts/allowed_hardware_signers; then
                  if [ "${OWNER_PR_APPROVED}" = "true" ] \
                     || { [ "${EVENT_NAME}" = "push" ] && [ "${GIT_REF}" = "refs/heads/${BASE_REF}" ]; }; then
                    if git -C "${TRUSTED}" grep -q -F -- '--owner-approved' -- crates/agent-guard/src/ring0_ratchet.rs; then
                      "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
                        --base "origin/${BASE_REF}" --owner-approved
                    else
                      "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
                        --base "origin/${BASE_REF}" --corpus-only
                    fi
                  else
                    "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
                      --base "origin/${BASE_REF}"
                  fi
                else
                  "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
                    --base "origin/${BASE_REF}" --corpus-only
                fi
                ;;
            esac
          elif git merge-base --is-ancestor 0194af29450aa65d1699337ec731d1740efc00e4 "${BASE_OID}" \
               && ! git cat-file -e "${BASE_OID}:config/allowed_human_signers" 2>/dev/null; then
            # Self-extinguishing one-time genesis bootstrap (never compiles PR sources): constrains any
            # non-human/automation actor to the 5-file Ring-2 allowlist and requires authenticated human
            # owner actor (susanbeasles) + pinned signer digest for the initial enrollment.
            python3 -c 'import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))' "${TRUSTED}" "${GITHUB_WORKSPACE}" "${BASE_OID}" <<'PY'
          import hashlib, os, subprocess, sys, tomllib
          trusted, ws, base_oid = sys.argv[1], sys.argv[2], sys.argv[3]
          RING2_ALLOWLIST = {
              "crates/agent-guard/src/cmd_policy.rs",
              "crates/agent-guard/src/mcp_policy.rs",
              "crates/agent-guard/src/diagnostics.rs",
              "tests/bypass_corpus.toml",
              "crates/agent-guard/tests/ring2_policy_tests.rs",
          }
          PINNED_SIGNERS_SHA256 = "89ce5a026336a21d62959969b1552654c79709d03601d82f16fc3102d1dd7692"
          mb = subprocess.check_output(["git", "-C", ws, "merge-base", "HEAD", base_oid], text=True).strip()
          if subprocess.run(["git", "-C", ws, "merge-base", "--is-ancestor", "0194af29450aa65d1699337ec731d1740efc00e4", mb]).returncode != 0:
              raise SystemExit(f"GENESIS_VIOLATION: merge-base {mb} does not descend from v2.0.0 genesis")
          changed = [
              p for p in subprocess.check_output(
                  ["git", "-C", ws, "diff", "--name-only", base_oid], text=True
              ).splitlines() if p.strip()
          ]
          outside_ring2 = [p for p in changed if p not in RING2_ALLOWLIST]
          if outside_ring2:
              actor = os.environ.get("EVENT_ACTOR", "")
              if actor.endswith("[bot]") or actor != "susanbeasles":
                  raise SystemExit(
                      f"GENESIS_VIOLATION: paths outside 5-file Ring-2 allowlist ({outside_ring2[:3]}) require authenticated human owner enrollment"
                  )
              sig_path = os.path.join(ws, "config", "allowed_human_signers")
              if os.path.islink(sig_path) or not os.path.isfile(sig_path):
                  raise SystemExit("GENESIS_VIOLATION: config/allowed_human_signers missing or symlink")
              digest = hashlib.sha256(open(sig_path, "rb").read()).hexdigest()
              if digest != PINNED_SIGNERS_SHA256:
                  raise SystemExit(f"GENESIS_VIOLATION: signers sha256 {digest} != {PINNED_SIGNERS_SHA256}")
          base_vecs = tomllib.load(open(os.path.join(trusted, "tests", "bypass_corpus.toml"), "rb"))["vectors"]
          head_vecs = tomllib.load(open(os.path.join(ws, "tests", "bypass_corpus.toml"), "rb"))["vectors"]
          if len(head_vecs) < len(base_vecs) or head_vecs[:len(base_vecs)] != base_vecs:
              raise SystemExit("GENESIS_VIOLATION: bypass_corpus.toml violates prefix identity against base")
          seen = set()
          for idx, v in enumerate(head_vecs):
              key = (v["kind"], " ".join(v["payload"].split()))
              if key in seen:
                  raise SystemExit(f"GENESIS_VIOLATION: duplicate corpus vector at #{idx + 1}")
              seen.add(key)
          print(f"[RING0 RATCHET GENESIS OK] base={base_oid[:12]} corpus={len(head_vecs)} (+{len(head_vecs)-len(base_vecs)})")
          PY
          else
            echo "::error::Trusted base ${BASE_OID} lacks verify-ring0-ratchet and is not the pinned genesis commit; failing closed."
            exit 1
          fi
