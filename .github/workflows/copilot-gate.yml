name: Server-Side Ring-0 & Copilot Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: copilot-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-and-ratchet-gate:
    name: Evaluate Ring-0 & Copilot Gate Status
    # Decoy-PR defense: commit statuses are per-SHA, so a PR aimed at a scratch branch must never
    # mint a green gate status that a second PR (same head SHA) into the default branch inherits.
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Checkout PR head commit (full history for merge-base & hardware-key check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # No GH_TOKEN is exposed to any step that compiles or executes repository code.
      - name: Build verifier from trusted base & run Ring-0 ratchet (token-less)
        id: ratchet
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE_OID="$(git rev-parse --verify "origin/${BASE_REF}^{commit}")"
          TRUSTED="${RUNNER_TEMP}/trusted-base"
          git worktree add --detach "${TRUSTED}" "${BASE_OID}"
          for f in .cargo/config .cargo/config.toml rust-toolchain rust-toolchain.toml; do
            if [ -e "${TRUSTED}/${f}" ] || [ -e "${GITHUB_WORKSPACE}/${f}" ]; then
              echo "::error::Refusing to run ratchet: forbidden toolchain override ${f} present"
              exit 1
            fi
          done
          if git -C "${TRUSTED}" grep -q -F 'verify-ring0-ratchet' -- crates/agent-guard/src/cli.rs; then
            (cd "${TRUSTED}" && CARGO_TARGET_DIR="${RUNNER_TEMP}/trusted-target" \
              cargo build --locked -p agent-guard --bin dotagent)
            "${RUNNER_TEMP}/trusted-target/debug/dotagent" verify-ring0-ratchet \
              --base "origin/${BASE_REF}" --json > "${RUNNER_TEMP}/ratchet_report.json"
          elif [ "${BASE_OID}" = "0194af29450aa65d1699337ec731d1740efc00e4" ]; then
            # Self-extinguishing one-time genesis bootstrap (never compiles PR sources): verifies pinned
            # signer keyring digest and strict corpus prefix-superset directly against TRUSTED base.
            python3 - "${TRUSTED}" "${GITHUB_WORKSPACE}" "${BASE_OID}" "${RUNNER_TEMP}/ratchet_report.json" <<'PY'
          import hashlib, json, os, subprocess, sys, tomllib

          trusted, ws, base_oid, out_json = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          PINNED_SIGNERS_SHA256 = "89ce5a026336a21d62959969b1552654c79709d03601d82f16fc3102d1dd7692"
          mb = subprocess.check_output(["git", "-C", ws, "merge-base", "HEAD", base_oid], text=True).strip()
          if mb != base_oid:
              raise SystemExit(f"GENESIS_VIOLATION: merge-base {mb} != {base_oid}")
          sig_path = os.path.join(ws, "config", "allowed_human_signers")
          if os.path.islink(sig_path) or not os.path.isfile(sig_path):
              raise SystemExit("GENESIS_VIOLATION: config/allowed_human_signers missing or symlink")
          digest = hashlib.sha256(open(sig_path, "rb").read()).hexdigest()
          if digest != PINNED_SIGNERS_SHA256:
              raise SystemExit(f"GENESIS_VIOLATION: signers sha256 {digest} != {PINNED_SIGNERS_SHA256}")
          base_vecs = tomllib.load(open(os.path.join(trusted, "tests", "bypass_corpus.toml"), "rb"))["vectors"]
          head_vecs = tomllib.load(open(os.path.join(ws, "tests", "bypass_corpus.toml"), "rb"))["vectors"]
          if len(head_vecs) < len(base_vecs) or head_vecs[:len(base_vecs)] != base_vecs:
              raise SystemExit("GENESIS_VIOLATION: bypass_corpus.toml violates prefix identity against base")
          seen = set()
          for idx, v in enumerate(head_vecs):
              key = (v["kind"], " ".join(v["payload"].split()))
              if key in seen:
                  raise SystemExit(f"GENESIS_VIOLATION: duplicate corpus vector at #{idx + 1}")
              seen.add(key)
          with open(out_json, "w", encoding="utf-8") as fh:
              json.dump({
                  "base_ref": f"origin/{os.environ['BASE_REF']}",
                  "merge_base": base_oid,
                  "human_hardware_signed": False,
                  "enforce_ring0_paths": False,
                  "base_corpus_count": len(base_vecs),
                  "head_corpus_count": len(head_vecs),
                  "added_corpus_vectors": len(head_vecs) - len(base_vecs),
              }, fh)
          PY
          else
            echo "::error::Trusted base ${BASE_OID} lacks verify-ring0-ratchet and is not the pinned genesis commit; failing closed."
            exit 1
          fi

      # Runs no cargo / repository code; only stdlib Python + gh against the GitHub API.
      - name: Post Ring-0 & Copilot Gate commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RATCHET_OUTCOME: ${{ steps.ratchet.outcome }}
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/ratchet_report.json" <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["REPO_FULL"]
          owner, name = repo.split("/", 1)
          pr_num = int(os.environ["PR_NUMBER"])
          head_sha = os.environ["PR_HEAD_SHA"]
          COPILOT = "copilot-pull-request-reviewer[bot]"

          def set_status(state, desc):
              subprocess.run(
                  [
                      "gh", "api", "-X", "POST", f"repos/{repo}/statuses/{head_sha}",
                      "-f", f"state={state}",
                      "-f", "context=Ring-0 & Copilot Gate",
                      "-f", f"description={desc[:135]}",
                  ],
                  stdout=subprocess.DEVNULL,
                  check=True,
              )

          def gh_json(args):
              out = subprocess.check_output(["gh"] + args, text=True)
              return json.loads(out) if out.strip() else None

          def evaluate():
              if os.environ.get("RATCHET_OUTCOME") != "success":
                  set_status("failure", "Ring-0 Constitutional Ratchet failed")
                  return 1
              with open(sys.argv[1], "r", encoding="utf-8") as fh:
                  _ratchet = json.load(fh)

              gql = (
                  "query($owner:String!,$name:String!,$pr:Int!){"
                  "repository(owner:$owner,name:$name){"
                  "pullRequest(number:$pr){"
                  "reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved}}"
                  "}}}"
              )
              gql_data = gh_json([
                  "api", "graphql",
                  "-f", f"query={gql}",
                  "--raw-field", f"owner={owner}",
                  "--raw-field", f"name={name}",
                  "-F", f"pr={pr_num}",
              ])
              if not isinstance(gql_data, dict) or gql_data.get("errors"):
                  raise ValueError("GraphQL errors while reading review threads")
              rt = gql_data["data"]["repository"]["pullRequest"]["reviewThreads"]
              if rt["pageInfo"]["hasNextPage"]:
                  set_status("failure", ">100 review threads; manual review required")
                  return 1
              unresolved = sum(1 for n in rt["nodes"] if not n["isResolved"])

              pages = gh_json(["api", "--paginate", "--slurp", f"repos/{repo}/pulls/{pr_num}/reviews"]) or []
              reviews = [r for p in pages for r in (p if isinstance(p, list) else [p])]
              # Track the newest Copilot review on head_sha including DISMISSED so a subsequent
              # dismissal invalidates any earlier clean review on the same commit.
              latest_copilot = None
              for rev in reviews:
                  u = rev.get("user") or {}
                  is_copilot = u.get("login", "") == COPILOT and str(u.get("type", "")).lower() == "bot"
                  if is_copilot and rev.get("commit_id") == head_sha:
                      if latest_copilot is None or int(rev.get("id", 0)) >= int(latest_copilot.get("id", 0)):
                          latest_copilot = rev

              if latest_copilot is not None:
                  rid = latest_copilot["id"]
                  rstate = str(latest_copilot.get("state", "")).upper()
                  if rstate == "DISMISSED":
                      set_status("pending", "Latest Copilot review on head was dismissed; awaiting fresh review")
                      return 0
                  cpages = gh_json(["api", "--paginate", "--slurp", f"repos/{repo}/pulls/{pr_num}/reviews/{rid}/comments"]) or []
                  inline_comments = sum(len(p) if isinstance(p, list) else 1 for p in cpages)
                  if rstate == "CHANGES_REQUESTED" or inline_comments > 0:
                      set_status(
                          "failure",
                          f"Copilot inline_comments={inline_comments}, state={rstate} on head",
                      )
                      return 1
                  if unresolved > 0:
                      # Clean head review but stale threads remain: stay pending; resolving the
                      # threads re-triggers this workflow via pull_request_review_thread.
                      set_status("pending", f"Copilot clean on head; {unresolved} unresolved thread(s) remain")
                      return 0
                  set_status("success", "Ring-0 ratchet + Copilot 0-comment review verified")
                  return 0

              # Copilot review is required unconditionally on every PR (hardware signatures govern
              # only Ring-0 path eligibility in verify-ring0-ratchet, never review bypass).
              set_status("pending", "Waiting for copilot-pull-request-reviewer[bot] review on head commit")
              return 0

          try:
              rc = evaluate()
          except Exception as exc:  # fail closed on any API / parse error
              print(f"gate evaluation error: {exc}", file=sys.stderr)
              try:
                  set_status("failure", "Gate evaluation error (fail-closed)")
              finally:
                  rc = 1
          raise SystemExit(rc)
          PY
