# Pinned Golden Wire-Schema Contracts for Upstream AI Harnesses (dotagent v2.0)

[[contract]]
id = "claude_code_v1_pretool_bash_rewrite"
harness = "claude-code"
harness_version = "1.0.x"
subcommand = "pre-tool"
stdin_json = '{"session_id":"cc_contract_1","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git status -sb"}}'
expected_exit = 0
required_stdout_json_paths = ["hookSpecificOutput.hookEventName", "hookSpecificOutput.permissionDecision", "hookSpecificOutput.updatedInput.command"]
expected_stdout_substring = "exec-sandbox --sanitize-stream"

[[contract]]
id = "claude_code_v1_pretool_hard_deny"
harness = "claude-code"
harness_version = "1.0.x"
subcommand = "pre-tool"
stdin_json = '{"session_id":"cc_contract_2","hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"file_path":".env"}}'
expected_exit = 2
required_stdout_json_paths = ["decision", "permission", "reason", "continue", "hookSpecificOutput.permissionDecision", "hookSpecificOutput.permissionDecisionReason"]
expected_stdout_substring = "deny"

