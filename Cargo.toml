[workspace]
resolver = "3"
members = [
    "crates/agent-guard",
    "crates/dotagent-compiler",
    "crates/dotagent-harness",
    "crates/swarm-tools",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
collapsible_if = "allow"
dbg_macro = "deny"
todo = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
